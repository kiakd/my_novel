# log rotation กันดิสก์เต็มซ้ำ (mongo json log เคยโต 2GB จนดิสก์เต็ม → mongo crash → แชทล่ม)
x-logcap: &logcap
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    logging: *logcap
  novel:
    logging: *logcap
  web:
    logging: *logcap
  cloudflared:
    logging: *logcap
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: http2
