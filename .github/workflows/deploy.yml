name: build & deploy

# build image บน GitHub (ฟรี, แรงพอ) → push ขึ้น GHCR → ssh เข้า VPS สั่ง pull+up
# VPS ไม่ต้อง build เอง → ไม่เปลือง RAM 3GB
#
# เร่งความเร็ว: build เฉพาะ image ที่โฟลเดอร์ของมันเปลี่ยน (frontend เปลี่ยน → ไม่ rebuild backend)
# trigger: push เข้า main (เฉพาะเมื่อแตะโค้ดแอป) หรือกดเองจากแท็บ Actions
on:
  push:
    branches: [main]
    paths:
      - 'novel/**'
      - 'novel-next/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# กัน run ซ้อนกันบน main (push รัว ๆ) — รอให้ตัวก่อนเสร็จก่อน (ไม่ cancel กลางคัน กัน deploy ค้าง)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: kiakd                      # << GHCR namespace (ตัวพิมพ์เล็ก)

jobs:
  # --- ตรวจว่าโฟลเดอร์ไหนเปลี่ยน เพื่อ build เฉพาะที่จำเป็น ---
  changes:
    runs-on: ubuntu-latest
    outputs:
      novel: ${{ steps.f.outputs.novel }}
      next: ${{ steps.f.outputs.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            novel:
              - 'novel/**'
            next:
              - 'novel-next/**'

  # --- build backend (novel) เฉพาะเมื่อ novel/ เปลี่ยน หรือ กดรันเอง ---
  build-novel:
    needs: changes
    if: ${{ needs.changes.outputs.novel == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push novel
        uses: docker/build-push-action@v6
        with:
          context: ./novel
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/novel:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/novel:${{ github.sha }}
          cache-from: type=gha,scope=novel
          cache-to: type=gha,mode=max,scope=novel

  # --- build frontend (novel-next) เฉพาะเมื่อ novel-next/ เปลี่ยน หรือ กดรันเอง ---
  build-next:
    needs: changes
    if: ${{ needs.changes.outputs.next == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push novel-next
        uses: docker/build-push-action@v6
        with:
          context: ./novel-next
          push: true
          build-args: |
            BACKEND_URL=http://novel:3000
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/novel-next:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/novel-next:${{ github.sha }}
          cache-from: type=gha,scope=novel-next
          cache-to: type=gha,mode=max,scope=novel-next

  # --- deploy: รันแม้ build บางตัวถูกข้าม (เช่นแก้แค่ฝั่งเดียว / แก้ compose) แต่ไม่รันถ้า build fail ---
  deploy:
    needs: [build-novel, build-next]
    if: ${{ always() && needs.build-novel.result != 'failure' && needs.build-next.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH → VPS → pull & up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ~/my_novel
            git pull --ff-only
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ env.OWNER }}" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
