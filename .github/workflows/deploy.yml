name: build & deploy

# build image ทั้ง 2 ตัวบน GitHub (ฟรี, แรงพอ) → push ขึ้น GHCR → ssh เข้า VPS สั่ง pull+up
# VPS ไม่ต้อง build เอง → ไม่เปลือง RAM 3GB เลย
#
# trigger: push เข้า main (เฉพาะเมื่อแตะโค้ดแอป) หรือกดเองจากแท็บ Actions
on:
  push:
    branches: [main]
    paths:
      - 'novel/**'
      - 'novel-next/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  OWNER: kiakd                      # << GHCR namespace (ตัวพิมพ์เล็ก)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write               # ให้ push ขึ้น GHCR ด้วย GITHUB_TOKEN ได้
    strategy:
      matrix:
        include:
          - name: novel
            context: ./novel
            args: ""
          - name: novel-next
            context: ./novel-next
            args: |
              BACKEND_URL=http://novel:3000
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH → VPS → pull & up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ~/my_novel
            git pull --ff-only
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ env.OWNER }}" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
