# สแตกครบ: MongoDB + backend (novel) + frontend (novel-next) — จูนสำหรับ VPS 3GB
#
# โหมดใช้งาน:
#   • Local/dev (build เอง):     docker compose up -d --build
#   • VPS (pull image จาก CI):   docker compose pull && docker compose up -d
#       └ ตั้ง REGISTRY/TAG ใน .env ให้ชี้ GHCR (ค่า default = ghcr.io/kiakd)
#
# เปิดเว็บที่ http://<host>:3001  (frontend proxy /api,/uploads → backend อัตโนมัติ)
# LM Studio (Gemma) / ComfyUI รันบน host เท่านั้น (ต้อง GPU) → ใช้ host.docker.internal
# บน VPS ไม่มี GPU ก็ใช้ DeepSeek (cloud) เป็น provider แทนได้เลย

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.5"]   # cap cache กัน mongo กินครึ่งแรมบนเครื่องเล็ก
    volumes:
      - mongo-data:/data/db
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    # ไม่ publish port ออกนอก — เข้าถึงได้เฉพาะใน network ของ compose (ปลอดภัยกว่า)

  novel:
    image: ${REGISTRY:-ghcr.io/kiakd}/novel:${TAG:-latest}
    build: ./novel
    restart: unless-stopped
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=${MONGODB_DB:-novel}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - LMSTUDIO_URL=${LMSTUDIO_URL:-http://host.docker.internal:1234/v1/chat/completions}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-gemma-4-e4b-it-uncensored}
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
      - MEM_DB_PATH=${MEM_DB_PATH:-/data/chat-mem.sqlite}
      - EMBED_URL=${EMBED_URL:-}                   # RAG embedding (ว่าง = FTS keyword อย่างเดียว)
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - EMBED_MODEL=${EMBED_MODEL:-text-embedding-3-small}
      - EMBED_DIM=${EMBED_DIM:-512}
    volumes:
      - ./novel/uploads:/app/uploads        # เก็บรูป/อวตารถาวร
      - mem-data:/data                      # RAG sqlite (/data/chat-mem.sqlite)
    extra_hosts:
      - "host.docker.internal:host-gateway" # ให้ Linux เข้าถึงบริการบน host (LM Studio/ComfyUI)
    mem_limit: 512m
    depends_on:
      mongo:
        condition: service_healthy

  web:
    image: ${REGISTRY:-ghcr.io/kiakd}/novel-next:${TAG:-latest}
    build:
      context: ./novel-next
      args:
        BACKEND_URL: http://novel:3000     # ฝังลง rewrites ตอน build (ชื่อ service "novel")
    restart: unless-stopped
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3001:3001"                          # << เปิดเว็บที่นี่ (ชี้ reverse proxy/tunnel มาที่นี่)
    mem_limit: 640m
    depends_on:
      novel:
        condition: service_healthy

  # Cloudflare Tunnel — เปิดแอปออกเน็ตผ่านโดเมน โดยไม่ต้อง forward port / เปิด firewall
  # opt-in:  docker compose --profile tunnel up -d
  # ใน Cloudflare dashboard ตั้ง Public Hostname → Service = http://web:3001
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  mongo-data:
  mem-data:
