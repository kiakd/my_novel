<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Studio — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f5f0; --ink:#34322e; --accent:#6c5ce0; --accent-tint:#ece9ff;
    --line:#34322e; --muted:#6f6d63;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Kalam',cursive;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}

  /* ---- wireframe primitives ---- */
  .bar{height:9px;border-radius:4px;background:#dad7cf}
  .stripe{background:repeating-linear-gradient(45deg,#e9e7e0,#e9e7e0 6px,#dedcd3 6px,#dedcd3 12px)}
  .sketch{border:1.7px solid var(--line);border-radius:6px;background:#fff}
  .sketch-wob{border:1.9px solid var(--line);border-radius:16px 7px 18px 7px/7px 18px 7px 16px;background:#fff}
  .fill0{background:#fff}.fill1{background:#f0efe9}.fill2{background:#e4e2db}.fill3{background:#d4d2c9}
  hr.wf{border:none;border-top:1.7px solid var(--line);margin:0}
  .dash{border:1.6px dashed #b9b7ae !important}

  /* ---- explorer chrome ---- */
  .explorer{display:grid;grid-template-columns:250px 1fr;height:100vh;overflow:hidden}
  .ex-rail{background:#2b2a27;color:#e9e7e1;padding:18px 0 14px;overflow:auto;display:flex;flex-direction:column}
  .ex-brand{padding:0 20px 10px;font-weight:700;font-size:22px;line-height:1.05}
  .ex-brand small{display:block;font-size:11.5px;font-weight:400;color:#a7a59c;font-family:ui-monospace,monospace;letter-spacing:.4px;margin-top:5px}
  .ex-grp{padding:16px 20px 5px;font:11.5px ui-monospace,monospace;letter-spacing:1.6px;color:#86847b;text-transform:uppercase}
  .ex-item{display:flex;gap:11px;align-items:center;padding:8px 20px;cursor:pointer;font-size:16px;color:#cfcdc6;border:none;background:none;text-align:left;width:100%;font-family:inherit}
  .ex-item:hover{background:#37352f;color:#fff}
  .ex-item.on{background:var(--accent);color:#fff}
  .ex-item .g{width:20px;text-align:center;font-size:15px}
  .ex-foot{margin-top:auto;padding:16px 20px 0;font:12px ui-monospace,monospace;color:#7d7b72;line-height:1.6;border-top:1px solid #3a3833;margin:14px 14px 0}
  .ex-main{overflow:auto;padding:26px 30px 90px}
  .ex-cap{max-width:1180px;margin:0 auto}
  .ex-cap .eyebrow{font:12px ui-monospace,monospace;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
  .ex-cap h1{font-size:30px;margin:4px 0 5px}
  .ex-cap p{margin:0;font-size:17.5px;color:var(--muted);max-width:820px;line-height:1.35}
  .appr-tabs{display:flex;gap:11px;margin:18px 0 4px;flex-wrap:wrap}
  .appr-tab{border:1.7px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;cursor:pointer;min-width:168px;font-family:inherit;text-align:left}
  .appr-tab:hover{background:#faf9f5}
  .appr-tab.on{background:var(--accent-tint);border-color:var(--accent)}
  .appr-tab b{display:block;font-size:16.5px}
  .appr-tab .d{display:block;margin-top:3px;font-size:13px;color:var(--muted);font-family:ui-monospace,monospace;line-height:1.3}
  .appr-tab.on .d{color:var(--accent)}
  .canvas{max-width:1180px;margin:14px auto 0}

  /* ---- shared app frame (ShellFrame) ---- */
  .wf-app{width:100%;overflow:hidden}
  .wf-head{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:11px 16px;border-bottom:1.7px solid var(--line);flex-wrap:wrap}
  .wf-hl,.wf-hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .wf-logo{font-size:20px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .wf-select{padding:5px 12px;font-size:15px;min-width:172px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .wf-save{font-size:14.5px;color:#3a8f5a;margin-left:4px;white-space:nowrap}
  .wf-body{display:flex;min-height:566px}
  .wf-side{width:196px;border-right:1.7px solid var(--line);padding:10px 10px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
  .wf-grp{font:11.5px ui-monospace,monospace;letter-spacing:1.4px;color:#9a988f;padding:11px 8px 5px}
  .wf-nav{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;font-size:15.5px;color:#4a483f;cursor:default}
  .wf-nav .g{width:17px;text-align:center;font-size:14px;color:#85837a}
  .wf-nav.on{background:var(--accent-tint);color:var(--accent);border:1.4px solid var(--accent)}
  .wf-nav.on .g{color:var(--accent)}
  .wf-content{flex:1;padding:20px 22px;min-width:0}
  .wf-rail{width:248px;border-left:1.7px solid var(--line);padding:14px 14px;flex-shrink:0}
  .ttl{font-size:23px;margin:0 0 2px}
  .sub{font-size:14.5px;color:var(--muted);margin:0 0 14px}

  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#c7c5bd;border-radius:6px;border:3px solid var(--paper)}
  .ex-rail::-webkit-scrollbar-thumb{background:#4a4843;border-color:#2b2a27}
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="kit.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="content1.jsx"></script>
  <script type="text/babel" src="content2.jsx"></script>
  <script type="text/babel" src="content3.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
